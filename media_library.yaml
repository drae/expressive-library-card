# Media library: data for custom:expressive-library-card.
# The card calls these on demand (only while it is on screen) and reads the responses.
# Live state (queues, streams, disk) comes from the Sonarr, Radarr, Tautulli and SABnzbd integrations.
# Keys live in secrets.yaml:
#   sonarr_api_key: <Sonarr → Settings → General → API Key>
#   radarr_api_key: <Radarr → Settings → General → API Key>
#   tautulli_recently_added_url: "http://tautulli.media.svc.cluster.local:8181/api/v2?apikey=<key>&cmd=get_recently_added&count=40"
#   tautulli_plays_url: "http://tautulli.media.svc.cluster.local:8181/api/v2?apikey=<key>&cmd=get_plays_by_date&time_range=7"
#   tautulli_libraries_url: "http://tautulli.media.svc.cluster.local:8181/api/v2?apikey=<key>&cmd=get_libraries"
#   tautulli_activity_url: "http://tautulli.media.svc.cluster.local:8181/api/v2?apikey=<key>&cmd=get_activity"

rest_command:
  # Episodes from yesterday to `days` ahead, with hasFile and the series (images, network).
  sonarr_calendar:
    url: >-
      http://sonarr.downloads.svc.cluster.local:8989/api/v3/calendar?includeSeries=true&start={{
      (today_at() - timedelta(days=1)).isoformat() | urlencode }}&end={{
      (today_at() + timedelta(days=(days | default(7) | int(7)) + 1)).isoformat() | urlencode }}
    method: get
    headers:
      X-Api-Key: !secret sonarr_api_key
    timeout: 20

  # Monitored films with a cinema, digital or physical release in the window.
  radarr_calendar:
    url: >-
      http://radarr.downloads.svc.cluster.local:7878/api/v3/calendar?start={{
      (today_at() - timedelta(days=1)).isoformat() | urlencode }}&end={{
      (today_at() + timedelta(days=(days | default(7) | int(7)) + 1)).isoformat() | urlencode }}
    method: get
    headers:
      X-Api-Key: !secret radarr_api_key
    timeout: 20

  tautulli_recently_added:
    url: !secret tautulli_recently_added_url
    method: get
    timeout: 20

  tautulli_plays:
    url: !secret tautulli_plays_url
    method: get
    timeout: 20

  tautulli_libraries:
    url: !secret tautulli_libraries_url
    method: get
    timeout: 20

  tautulli_activity:
    url: !secret tautulli_activity_url
    method: get
    timeout: 20
